name: CI

on:
  push:
  pull_request:

jobs:
  focused-unit-tests:
    name: Focused unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev
          python -m pip install --upgrade pip
          python -m pip install pytest "setuptools>=68" numpy requests fastapi httpx soundfile
          python -m pip install -e .
          python -m pip install pyaudio
      - name: Run focused unit tests
        run: >-
          python -m pytest -q
          tests/test_audio_backend.py
          tests/test_base_engine_silence_trim.py
          tests/test_character_alignment.py
          tests/test_ctc_alignment.py
          tests/test_higgs_engine.py
          tests/test_inflect_engine.py
          tests/test_kokoro_engine_contract.py
          tests/test_language_router.py
          tests/test_minimax_engine.py
          tests/test_pocket_engine.py
          tests/test_pocket_gpu_engine.py
          tests/test_qwen_engine.py
          tests/test_qwen_cpu_engine.py
          tests/test_qwen_cpu_distribution.py
          tests/test_qwen_emotions.py
          tests/test_qwen_emotions_protocol.py
          tests/test_qwen_cpu_recovery.py
          tests/test_qwen_cpu_recovery_server.py
          tests/test_qwen_language_endpoint.py
          tests/test_qwen_segmented_narration.py
          tests/test_qwen_symbol_fragments.py
          tests/test_em_dash_fragments.py
          tests/test_qwen_server.py
          tests/test_release_guard.py
          tests/test_release_guard_cli.py
          tests/test_public_cpu_release_profile.py
          tests/test_release_metadata.py
          tests/test_safepipe_logging.py
          tests/test_sentence_splitter_preload.py
          tests/test_sentence_tokenizer_defaults.py
          tests/test_stream_player_stop.py
          tests/test_text_to_stream_alignment.py

  documentation:
    name: Build documentation strictly
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation tools
        run: >-
          python -m pip install
          "mkdocs>=1.6,<2"
          "mkdocs-material>=9.7,<10"
          "mkdocs-static-i18n>=1.3,<2"
      - name: Build documentation
        run: python -m mkdocs build --strict

  package-artifacts:
    name: Build and validate package artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Smoke-test wheel in a clean environment
        run: python tools/clean_install_smoke.py dist
